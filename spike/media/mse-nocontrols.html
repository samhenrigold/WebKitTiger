<!doctype html>
<meta charset="utf-8">
<title>Tiger media: MSE</title>
<style>body{font:14px Helvetica;margin:12px;background:#eef} video{display:block;background:#000} #s{font:12px Monaco;white-space:pre}</style>
<h2>MediaSource: dash/ init + 2 s fMP4 segments (avc1 640x360 + mp4a)</h2>
<video id="v" width="640" height="360" autoplay></video>
<div id="s">waiting</div>
<script>
var v=document.getElementById('v'),s=document.getElementById('s'),log=[];
function L(m){log.push(m);if(log.length>12)log.shift()}
var VT='video/mp4; codecs="avc1.64001e"',AT='audio/mp4; codecs="mp4a.40.2"';
L('isTypeSupported video='+MediaSource.isTypeSupported(VT)+' audio='+MediaSource.isTypeSupported(AT)+' vp9='+MediaSource.isTypeSupported('video/webm; codecs="vp9"'));
var ms=new MediaSource();v.src=URL.createObjectURL(ms);
function fetchBuf(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(u+' '+r.status);return r.arrayBuffer()})}
function feed(sb,stream,n,done){
  var i=0;
  function next(){
    if(i>n){done();return}
    var u=i==0?'dash/init-stream'+stream+'.m4s':'dash/chunk-stream'+stream+'-'+String(i).padStart(5,'0')+'.m4s';
    i++;
    fetchBuf(u).then(function(b){sb.addEventListener('updateend',next,{once:true});sb.appendBuffer(b)}).catch(function(e){L('fetch fail '+e.message);done()});
  }
  next();
}
ms.addEventListener('sourceopen',function(){
  L('sourceopen');
  var pending=2;function one(){if(--pending==0){L('all appended, endOfStream');try{ms.endOfStream()}catch(e){L('eos '+e.message)}}}
  try{feed(ms.addSourceBuffer(VT),0,5,one);feed(ms.addSourceBuffer(AT),1,5,one)}catch(e){L('addSourceBuffer '+e.message)}
});
['loadedmetadata','loadeddata','canplay','playing','pause','ended','error','stalled','waiting','seeked'].forEach(function(e){v.addEventListener(e,function(){L(e+'@'+v.currentTime.toFixed(2))})});
setInterval(function(){
  var b='';try{for(var i=0;i<v.buffered.length;i++)b+='['+v.buffered.start(i).toFixed(2)+'-'+v.buffered.end(i).toFixed(2)+']'}catch(e){}
  s.textContent='ms.readyState '+ms.readyState+' readyState '+v.readyState+' paused '+v.paused+' t='+v.currentTime.toFixed(2)+'/'+v.duration.toFixed(2)+' '+v.videoWidth+'x'+v.videoHeight+' buffered '+b+'\n'+log.join('\n')+(v.error?'\nERROR '+v.error.code+' '+v.error.message:'');
},250);
</script>
