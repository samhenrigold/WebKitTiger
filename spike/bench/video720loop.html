<!doctype html>
<meta charset="utf-8">
<title>Tiger media: 720p mp4, looping</title>
<style>body{font:14px Helvetica;margin:12px;background:#eee} video{display:block;background:#000} #s{font:12px Monaco;white-space:pre}</style>
<h2>&lt;video src=bbb-720p.mp4&gt; (H.264 High 1280x720 30fps + AAC, shown at 896x504)</h2>
<video id="v" src="bbb-720p.mp4" width="896" height="504" autoplay controls loop></video>
<div id="s">waiting</div>
<script>
var v=document.getElementById('v'),s=document.getElementById('s'),t0=0,events=[];
['loadedmetadata','loadeddata','canplay','canplaythrough','playing','play','pause','ended','error','stalled','waiting','seeked'].forEach(function(e){v.addEventListener(e,function(){events.push(e+'@'+v.currentTime.toFixed(2))})});
setInterval(function(){
  s.textContent='readyState '+v.readyState+' network '+v.networkState+' paused '+v.paused+' t='+v.currentTime.toFixed(2)+'/'+v.duration.toFixed(2)+' '+v.videoWidth+'x'+v.videoHeight+'\n'+events.join(' ')+(v.error?' ERROR '+v.error.code:'');
},250);
</script>
