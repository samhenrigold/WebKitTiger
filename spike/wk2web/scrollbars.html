<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>scrollbars</title>
<style>
body { font: 13px "Lucida Grande", sans-serif; margin: 12px; background: #fff; }
.box { border: 1px solid #888; background: #f4f4f4; margin: 0 16px 0 0; float: left; }
#over { width: 260px; height: 240px; overflow: auto; }
#over .inner { width: 480px; }
#thin { width: 200px; height: 240px; overflow: auto; scrollbar-width: thin; }
#frame { width: 220px; height: 240px; }
p { margin: 0 0 6px 0; }
#tail { clear: both; padding-top: 16px; }
</style></head>
<body>
<div id="over" class="box"><div class="inner" id="overInner"></div></div>
<div id="thin" class="box"><div id="thinInner"></div></div>
<iframe id="frame" class="box" srcdoc="<body style='font:13px Lucida Grande;margin:6px'>frame line 1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12<br>13<br>14<br>15<br>16<br>17<br>18<br>19<br>20<br>21<br>22<br>23<br>24<br>25<br>26<br>27<br>28<br>29<br>30 end</body>"></iframe>
<div id="tail"></div>
<script>
function fill(id, n, prefix) {
  var html = "";
  for (var i = 1; i <= n; ++i) html += "<p>" + prefix + " line " + i + "</p>";
  document.getElementById(id).innerHTML = html;
}
fill("overInner", 40, "overflow: auto, wider than its box,");
fill("thinInner", 40, "scrollbar-width: thin");
fill("tail", 120, "The body is long so the main frame scrolls;");
// The harness reads the scroll positions off the window title.
function report() {
  document.title = "y=" + Math.round(window.scrollY) + " x=" + Math.round(window.scrollX)
    + " over=" + document.getElementById("over").scrollTop + "," + document.getElementById("over").scrollLeft
    + " thin=" + document.getElementById("thin").scrollTop;
}
window.addEventListener("scroll", report);
document.getElementById("over").addEventListener("scroll", report);
document.getElementById("thin").addEventListener("scroll", report);
report();
</script>
</body></html>
