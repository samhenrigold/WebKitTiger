<!DOCTYPE html>
<!-- One of every native control, in the states that have distinct Aqua artwork.
     Judged by eye against a real 10.4 window; see spike/wk2web/stage-controls.sh. -->
<html>
<head>
<meta charset="utf-8">
<title>Aqua controls</title>
<style>
  body { background: #ededed; font: 13px "Lucida Grande", sans-serif; margin: 12px; }
  h2 { font-size: 11px; font-weight: bold; margin: 14px 0 4px; color: #444; }
  .row { margin: 4px 0; }
  .row > * { margin-right: 10px; vertical-align: middle; }
  .small { font-size: 11px; }
  .mini { font-size: 9px; }
</style>
</head>
<body>

<h2>push buttons</h2>
<div class="row">
  <button>Button</button>
  <button disabled>Disabled</button>
  <input type="submit" value="Default">
  <button class="small">Small</button>
  <button class="mini">Mini</button>
</div>

<h2>check boxes and radios</h2>
<div class="row">
  <input type="checkbox"><input type="checkbox" checked><input type="checkbox" disabled>
  <input type="radio" name="r"><input type="radio" name="r" checked><input type="radio" disabled>
  <input type="checkbox" class="small" checked><input type="radio" class="small" checked>
</div>

<h2>text fields</h2>
<div class="row">
  <input type="text" value="text field" size="16">
  <input type="text" value="disabled" size="10" disabled>
  <input type="search" value="search" size="12">
  <input type="password" value="secret" size="10">
</div>
<div class="row">
  <textarea rows="2" cols="26">text area</textarea>
</div>

<h2>pop-ups</h2>
<div class="row">
  <select><option>Popup button</option><option>Second</option></select>
  <select disabled><option>Disabled</option></select>
  <select class="small"><option>Small</option></select>
</div>

<h2>sliders, progress, meter</h2>
<div class="row">
  <input type="range" value="40">
  <input type="range" value="75" disabled>
</div>
<div class="row">
  <progress value="0.4"></progress>
  <progress></progress>
  <meter value="0.6"></meter>
</div>


<script>
// The page's own view of what happened: every input/change event from any control, newest
// first, echoed into the title so a screenshot of the title bar is the assertion.
var log = [];
function note(e) {
  var t = e.target, v;
  if (t.type === 'checkbox' || t.type === 'radio') v = t.checked ? 'on' : 'off';
  else if (t.tagName === 'SELECT') v = t.selectedIndex + ':' + t.value;
  else v = t.value;
  log.unshift(e.type + ' ' + (t.tagName + '/' + (t.type || '')) + '=' + v);
  document.title = log.slice(0, 3).join(' | ');
}
document.addEventListener('input', note, true);
document.addEventListener('change', note, true);
document.addEventListener('click', function (e) {
  if (e.target.tagName === 'BUTTON' || e.target.type === 'submit')
    { log.unshift('click ' + (e.target.value || e.target.textContent)); document.title = log.slice(0, 3).join(' | '); }
}, true);
</script>
</body>
</html>
